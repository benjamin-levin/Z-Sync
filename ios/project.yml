name: ZenCompanion
options:
  bundleIdPrefix: de.kjell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  ZenCompanion:
    type: application
    platform: iOS
    sources:
      - path: ZenCompanion
        excludes:
          - "PrivacyInfo.xcprivacy"
      - path: Shared
      - path: ZenCompanion/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    info:
      path: ZenCompanion/Info.plist
      properties:
        CFBundleDisplayName: Z-Sync Preview
        CFBundleName: Z-Sync
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Required for the pending default-browser entitlement request.
        # Distribution must wait for the matching managed entitlement/signing.
        CFBundleURLTypes:
          - CFBundleURLName: com.benjaminlevin.zsync.preview.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - http
              - https
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: en
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Google result clicks 302 from https://www.google.com/goto to cleartext
          # http hosts. WKWebView drops that hop unless web content is exempt.
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: Z-Sync loads the icon of a synced tab from the tab's own address, which may be a device on your local network.
        # Asked only after a website in the browser wants them and the reader allows it.
        NSCameraUsageDescription: Websites you allow in the browser can use your camera.
        NSMicrophoneUsageDescription: Websites you allow in the browser can use your microphone.
        NSLocationWhenInUseUsageDescription: Websites you allow in the browser can use your location.
        # Downloads land in Documents, which Files shows under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ZenCompanion/ZenCompanion.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.benjaminlevin.zsync.preview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminlevin.zsync.preview
        INFOPLIST_FILE: ZenCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZenCompanion/ZenCompanion.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "PrivacyInfo.xcprivacy"
      - path: Shared
      - path: ZenCompanion/Assets.xcassets
        excludes:
          - "AppIcon.appiconset"
      - path: ShareExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Z-Sync Preview
        CFBundleName: Z-Sync
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Z-Sync loads the icon of a synced tab from the tab's own address, which may be a device on your local network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.benjaminlevin.zsync.preview
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.benjaminlevin.zsync.preview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminlevin.zsync.preview.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "10"
        SKIP_INSTALL: true
  ZenCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZenCompanionTests
      - path: Shared
      # Leaf dirs so JSON lands at the test-bundle root (loaders use basename).
      - path: ../shared/contract/fixtures/crypto
        name: ContractFixturesCrypto
        buildPhase: resources
      - path: ../shared/contract/fixtures/wire
        name: ContractFixturesWire
        buildPhase: resources
      - path: ../shared/contract/fixtures/auth
        name: ContractFixturesAuth
        buildPhase: resources
      - path: ../shared/contract/http
        name: ContractHTTP
        buildPhase: resources
    dependencies:
      - target: ZenCompanion
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminlevin.zsync.preview.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  ZenCompanion:
    build:
      targets:
        ZenCompanion: all
        ZenCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZenCompanionTests
